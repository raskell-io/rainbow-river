<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rainbow River</title>
  <style>
    :root { --bg: #14141c; --fg: #b8b8c8; --dim: #686878; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { display: grid; place-items: center; grid-template-rows: 1fr auto; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    footer { padding: 12px 16px; color: var(--dim); text-align: center; }
    kbd { color: var(--fg); }
  </style>
</head>
<body>
  <canvas id="screen" width="240" height="160"></canvas>
  <footer>
    <kbd>Arrows/WASD</kbd> move · <kbd>X/K</kbd> A · <kbd>Z/J</kbd> B (hold to run) ·
    <kbd>Enter</kbd> Start (fish log)
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
