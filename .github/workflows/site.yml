name: Site

# Tests and builds the website. Cloudflare Pages builds and deploys it from
# `main` with scripts/cf-pages-build.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The WASM-AD player (wasm-ad.js and the reference renderer) ships with the site.
      - uses: actions/checkout@v4
        with:
          repository: raskell-io/wasm-ad
          path: wasm-ad
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: make site WASM_AD=wasm-ad
